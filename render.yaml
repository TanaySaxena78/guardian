# Render blueprint: New > Blueprint > pick this repo. Add the two keys when asked.
services:
  - type: web
    name: agent-guardian
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: AGENT_MODEL
        value: gemini-3.8-flash
      - key: JUDGE_MODEL
        value: gemini-3.5-flash-lite
      - key: RULES_MODEL
        value: gemini-3.5-flash-lite
      - key: RUNS_PER_IP_PER_HOUR
        value: "10"
